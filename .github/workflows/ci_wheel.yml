---
name: Build wheel
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  actions: write
  contents: write

jobs:
  build:
    name: "${{ matrix.label }} wheels"
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: windows-latest
            label: win-64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir dist/

      - name: List contents
        run: |
          ls -la dist/
