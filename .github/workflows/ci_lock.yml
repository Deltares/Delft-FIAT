---
name: Update lockfile
permissions:
  contents: write
  pull-requests: write
on:
  schedule:
    - cron: 0 5 1 * * # First of every month
  workflow_dispatch:

jobs:
  pixi-update:
    defaults:
      run:
        shell: bash -e -l {0}
    timeout-minutes: 30
    name: linux-64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: "v0.83.0"
          run-install: false

      - name: Update lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi
          base: main
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
