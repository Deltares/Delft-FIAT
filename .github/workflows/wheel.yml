---
name: Build wheels
on:
  workflow_call:
permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.label }} - py${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        python-version:
          - "312"
          - "313"
          - "314"
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: windows-latest
            label: win-64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pixi env
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: "v0.83.0"
          environments: build
          locked: false
          cache: true
          cache-write: false

      - name: Set env prefix
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PREFIX=$(cygpath -m "$PWD/.pixi/envs/build")
          else
            # -g0 and -s keep debug info out of the extension modules
            PREFIX="/project/.pixi/envs/build CFLAGS=-g0 CXXFLAGS=-g0 LDFLAGS=-s"
          fi
          echo "CIBW_ENVIRONMENT=PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      - name: Build wheels
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
        run: python -m cibuildwheel --output-dir dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.label }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
