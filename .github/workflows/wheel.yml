---
name: Test wheel

on:
  workflow_call:
    inputs:
      python-version: { type: string, required: true }
      os: { type: string, required: true }
      artifact-name: { type: string, required: true }

jobs:
  unit:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Download cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: test-data
          enableCrossOsArchive: true

      - name: Setup pixi env
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: "v0.83.0"
          environments: wheel
          locked: false
          cache: true
          cache-write: false

      - name: Install wheel
        shell: bash -l {0}
        run: |
          rm -rf src
          WHEEL=$(ls dist/*.whl)
          pixi run -e wheel uv pip install "${WHEEL}"

      - name: Test
        run: pixi run --no-install -e wheel test-cov

  integration:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Download cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: test-data
          enableCrossOsArchive: true

      - name: Setup pixi env
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: "v0.83.0"
          environments: wheel
          locked: false
          cache: true
          cache-write: false

      - name: Install wheel
        shell: bash -l {0}
        run: |
          rm -rf src
          WHEEL=$(ls dist/*.whl)
          pixi run -e wheel uv pip install "${WHEEL}"

      - name: Test
        run: pixi run --no-install -e wheel test-integration

  system:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Download cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: test-data
          enableCrossOsArchive: true

      - name: Setup pixi env
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: "v0.83.0"
          environments: wheel
          locked: false
          cache: true
          cache-write: false

      - name: Install wheel
        shell: bash -l {0}
        run: |
          rm -rf src
          WHEEL=$(ls dist/*.whl)
          pixi run -e wheel uv pip install "${WHEEL}"

      - name: Test
        run: pixi run --no-install -e wheel test-system
