---
name: Pypi release
on:
  release:
    types:
      - published
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: "3.13"

      - name: Setup build packages
        run: |
          pip install build tomli twine wheel

      - name: Build sdist
        run: |
          python -m build --sdist
          python -m twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  wheels:
    uses: ./.github/workflows/wheel.yml

  test-build:
    needs: wheels

    uses: ./.github/workflows/testw.yml
    with:
      artifact-name: dist-wheel-linux-64-314
      os: ubuntu-latest
      python-version: "314"

  upload-testpypi:
    needs: [sdist, wheels, test-build]
    if: github.event_name == 'push'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/Delft-FIAT
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdist/ wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  upload-pypi:
    needs: [sdist, wheels, test-build]
    if: ${{ github.event_name == 'release' && !github.event.act }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/Delft-FIAT
    permissions:
      id-token: write

    steps:
      - name: Download sdist/ wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
